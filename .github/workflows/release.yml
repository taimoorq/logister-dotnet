name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.3.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify immutable tag belongs to reviewed main
        run: bash scripts/verify-release-ref.sh

      - name: Check public repository safety
        run: bash scripts/publication-safety-check.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash scripts/verify-release-version.sh "$TAG_NAME"

      - name: Build release notes from changelog
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          title="$(awk -v tag="$TAG_NAME" '
            $0 ~ "^## " tag "([[:space:]]|-|$)" { sub(/^## /, ""); print; exit }
          ' CHANGELOG.md)"
          test -n "$title"
          awk -v tag="$TAG_NAME" '
            $0 ~ "^## " tag "([[:space:]]|-|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Logister.sln

      - name: Audit dependencies
        run: |
          dotnet list Logister.sln package --vulnerable --include-transitive --no-restore --format json > dependency-audit.json
          python3 scripts/check-dependency-audit.py dependency-audit.json

      - name: Build Logister
        run: dotnet build src/Logister/Logister.csproj --configuration Release --no-restore -v minimal

      - name: Build Logister.AspNetCore
        run: dotnet build src/Logister.AspNetCore/Logister.AspNetCore.csproj --configuration Release --no-restore -v minimal

      - name: Run tests
        run: |
          dotnet run --project tests/Logister.Tests/Logister.Tests.csproj --framework net8.0 --configuration Release --no-restore
          dotnet run --project tests/Logister.Tests/Logister.Tests.csproj --framework net10.0 --configuration Release --no-restore

      - name: Pack Logister
        run: dotnet pack src/Logister/Logister.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack Logister.AspNetCore
        run: dotnet pack src/Logister.AspNetCore/Logister.AspNetCore.csproj --configuration Release --no-build --output artifacts/packages

      - name: Inspect NuGet package file lists
        run: |
          set -euo pipefail
          for package in artifacts/packages/*.nupkg; do
            if unzip -Z1 "$package" | grep -Eq '(^|/)(\.env|tmp/release-|[^/]+\.(key|pem|p12|pfx))$|^/|\.\./'; then
              echo "::error::$package contains a publication-unsafe path."
              exit 1
            fi
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logister-dotnet-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Check NuGet package versions
        id: nuget_packages
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          logister_versions="$(curl --fail --silent https://api.nuget.org/v3-flatcontainer/logister/index.json)"
          aspnetcore_versions="$(curl --fail --silent https://api.nuget.org/v3-flatcontainer/logister.aspnetcore/index.json)"

          logister_exists=false
          aspnetcore_exists=false

          if echo "$logister_versions" | grep -q "\"${version}\""; then
            logister_exists=true
          fi

          if echo "$aspnetcore_versions" | grep -q "\"${version}\""; then
            aspnetcore_exists=true
          fi

          echo "logister_exists=${logister_exists}" >> "$GITHUB_OUTPUT"
          echo "aspnetcore_exists=${aspnetcore_exists}" >> "$GITHUB_OUTPUT"

          if [ "$logister_exists" = "true" ] && [ "$aspnetcore_exists" = "true" ]; then
            echo "packages_exist=true" >> "$GITHUB_OUTPUT"
            echo "Logister ${version} and Logister.AspNetCore ${version} already exist on NuGet."
          else
            echo "packages_exist=false" >> "$GITHUB_OUTPUT"
            echo "At least one NuGet package for ${version} is missing; publishing will continue."
          fi

      - name: Ensure NuGet API key is configured
        if: steps.nuget_packages.outputs.packages_exist != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::Missing NUGET_API_KEY repository secret."
            exit 1
          fi

      - name: Publish packages to NuGet
        if: steps.nuget_packages.outputs.packages_exist != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Verify NuGet publication
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          for attempt in $(seq 1 30); do
            core="$(curl --fail --silent https://api.nuget.org/v3-flatcontainer/logister/index.json)"
            web="$(curl --fail --silent https://api.nuget.org/v3-flatcontainer/logister.aspnetcore/index.json)"
            if echo "$core" | grep -q "\"${version}\"" && echo "$web" | grep -q "\"${version}\""; then
              mkdir -p artifacts/verified
              curl --fail --silent --location \
                "https://api.nuget.org/v3-flatcontainer/logister/${version}/logister.${version}.nupkg" \
                --output "artifacts/verified/Logister.${version}.nupkg"
              curl --fail --silent --location \
                "https://api.nuget.org/v3-flatcontainer/logister.aspnetcore/${version}/logister.aspnetcore.${version}.nupkg" \
                --output "artifacts/verified/Logister.AspNetCore.${version}.nupkg"
              dotnet nuget verify --all artifacts/verified/*.nupkg
              python3 scripts/verify-nuget-payload.py "artifacts/packages/Logister.${version}.nupkg" "artifacts/verified/Logister.${version}.nupkg"
              python3 scripts/verify-nuget-payload.py "artifacts/packages/Logister.AspNetCore.${version}.nupkg" "artifacts/verified/Logister.AspNetCore.${version}.nupkg"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Both NuGet packages were not visible within the verification window."
          exit 1

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
